# Sample PostGIS database with CloudNativePG (https://cloudnative-pg.io):
# PostgreSQL 18 on the minimal image, PostGIS mounted as an image volume
# extension (https://cloudnative-pg.io/docs/current/imagevolume_extensions)
# instead of baked into a PostGIS-specific Postgres image.
#
# Needs CloudNativePG 1.29+, Kubernetes 1.35+ (ImageVolume on by default; on
# 1.33/1.34 enable the ImageVolume feature gate) and containerd 2.1+ or
# CRI-O 1.31+. The extension image must match the PostgreSQL major version,
# the distribution (trixie) and the CPU architecture of the Cluster.
#
# CNPG creates the Secret "osm-app" with username, password and a ready-made
# libpq password file under the key "pgpass" (host osm-rw), which the sync
# uses via database.pgpassSecretRef. The Database resource below creates the
# postgis extension, so the sync user needs no superuser rights.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: osm
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-minimal-trixie
  postgresql:
    extensions:
      - name: postgis
        image:
          reference: ghcr.io/cloudnative-pg/postgis-extension:3.7.0-18-trixie
        # PostGIS's own shared libraries (GEOS, PROJ, GDAL, ...) ship in the
        # image's system directory
        ld_library_path:
          - system
        env:
          - name: GDAL_DATA
            value: ${image_root}/share/gdal
          - name: PROJ_DATA
            value: ${image_root}/share/proj
  bootstrap:
    initdb:
      database: osm
      owner: osm
  storage:
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
---
# CREATE EXTENSION postgis in the osm database, managed by CNPG.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: osm
spec:
  name: osm
  owner: osm
  cluster:
    name: osm
  extensions:
    - name: postgis
      version: "3.7.0"
