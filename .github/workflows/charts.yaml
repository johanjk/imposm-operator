---
name: charts

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths: &paths
      - charts/**
      - .github/workflows/charts.yaml
      - .github/workflows/helm-publish.yaml
      - .github/actions/kube-lint/**
      - .kube-linter.yaml
      - trivy.yaml
      - .trivyignore.yaml
      # what the controller renders (controller-manifests)
      - api/**
      - internal/controller/**
      - internal/spec/**
      - internal/runner/**
      - internal/mapping/**
      - examples/mapping/**
  push:
    branches:
      - master
    paths: *paths

permissions: {}

concurrency:
  group: charts-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  charts:
    permissions:
      contents: read
      packages: write  # needed for ghcr access

    uses: $/.github/workflows/helm-publish.yaml
    with:
      publish: ${{ github.event_name == 'push' }}

  # The objects the controller creates (crd and configmap modes) go through
  # the same checks as the chart's renders.
  controller-manifests:
    name: Lint controller-rendered objects
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Render controller objects
        run: make controller-manifests

      - name: Lint controller objects
        uses: $/.github/actions/kube-lint
        with:
          file: build/controller-manifests
          renderer: kustomize
