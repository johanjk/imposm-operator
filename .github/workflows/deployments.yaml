name: Release Deployment

# Publishes the controller and runner images (docker-bake.hcl targets
# controller-release and runner-release) once ci.yaml passed for the commit.
# Docker's reusable bake workflow builds each platform natively on its own
# runner (no emulation: the runner image compiles imposm with cgo), merges
# them into multi-arch tags and signs the provenance attestations.
on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions: {}

# A newer push to master replaces a master release still building; tag
# releases always finish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  ci:
    permissions:
      checks: read  # action-wait-for-check
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI to succeed
        uses: fountainhead/action-wait-for-check@5a908a24814494009c4bb27c242ea38c93c593be # v1.2.0
        id: wait-for-ci
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          checkName: check
          ref: ${{ github.sha }}
          timeoutSeconds: 3600

      - name: CI failed
        if: steps.wait-for-ci.outputs.conclusion != 'success'
        run: exit 1

  controller:
    needs: ci
    uses: docker/github-builder/.github/workflows/bake.yml@cbc9d42f8c89a55623392aadd03600965b80e963 # v1.18.1
    permissions:
      contents: read
      id-token: write  # signs the attestations
      packages: write  # needed for ghcr access
    with:
      target: controller-release
      meta-bake-target: docker-metadata-action-controller
      meta-images: ghcr.io/${{ github.repository_owner }}/imposm-operator
      meta-tags: &tags |
        type=sha
        type=ref,event=branch
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
      output: image
      push: true
      sbom: true
    secrets: &auth
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  runner:
    needs: ci
    uses: docker/github-builder/.github/workflows/bake.yml@cbc9d42f8c89a55623392aadd03600965b80e963 # v1.18.1
    permissions:
      contents: read
      id-token: write  # signs the attestations
      packages: write  # needed for ghcr access
    with:
      target: runner-release
      meta-bake-target: docker-metadata-action-runner
      meta-images: ghcr.io/${{ github.repository_owner }}/imposm-operator-runner
      meta-tags: *tags
      output: image
      push: true
      sbom: true
    secrets: *auth
