  # The operator's own RBAC: running syncs means creating Jobs and CronJobs,
  # rendering ConfigMaps and creating a NetworkPolicy and ServiceAccount per
  # sync. The runner pods use the operator's image and service account.
  # What the grant allows is wider than what the controller does: whoever
  # holds the controller's token can create pods that mount any Secret of a
  # namespace it covers (every namespace with rbac.scope=cluster). Documented
  # in docs/design.md (trust model); namespace scope limits it.
  - id: KSV-0048  # create/update workloads (jobs, cronjobs)
    path:
      - charts

  - id: KSV-0049  # manage configmaps
    path:
      - charts

  - id: KSV-0056  # manage networkpolicies
    path:
      - charts

  - id: KSV-01010  # "sensitive" ConfigMap content: secret *references* (name/key), no values
    path:
      - charts
