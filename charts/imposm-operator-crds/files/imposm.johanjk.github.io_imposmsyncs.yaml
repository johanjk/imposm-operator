          type: string
        - jsonPath: .status.lag
          name: Lag
          type: string
        - jsonPath: .status.activity
          name: Activity
          type: string
        - jsonPath: .status.lastRunTime
          name: Last Run
          type: date
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
        - jsonPath: .status.currentSequence
          name: Sequence
          priority: 1
          type: integer
        - jsonPath: .status.upstreamSequence
          name: Upstream
          priority: 1
          type: integer
        - jsonPath: .status.reimport.progress
          name: Reimport
          priority: 1
          type: string
        - jsonPath: .status.production.backupAvailable
          name: Backup
          priority: 1
          type: boolean
        - jsonPath: .status.storage.summary
          name: Storage
          priority: 1
          type: string
        - jsonPath: .status.expirePending
          name: Expire Pending
          priority: 1
          type: integer
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: ImposmSync keeps a PostGIS database in sync with OpenStreetMap using imposm.
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: ImposmSyncSpec describes one OSM database kept in sync by imposm.
              properties:
                database:
                  description: DatabaseSpec is the PostGIS target.
                  properties:
                    database:
                      description: Optional with secretRef.
                      minLength: 1
                      type: string
                    host:
                      description: Host name, IP or socket directory. Optional with secretRef.
                      minLength: 1
                      type: string
                    passwordSecretRef:
                      description: PasswordSecretRef points at a key holding the plain password.
                      properties:
                        key:
                          description: The key of the secret to select from.  Must be a valid secret key.
                          type: string
                        name:
                          default: ""
                          description: |-
                            Name of the referent.
                            This field is effectively required, but due to backwards compatibility is
                            allowed to be empty. Instances of this type with an empty value here are
                            almost certainly wrong.
                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                          type: string
                        optional:
                          description: Specify whether the Secret or its key must be defined
                          type: boolean
                      required:
                        - key
                      type: object
                      x-kubernetes-map-type: atomic
                    pgpassSecretRef:
                      description: |-
                        PgpassSecretRef points at a key holding a libpq password file
                        (CloudNativePG's <cluster>-app secret has one under "pgpass").
                      properties:
                        key:
                          description: The key of the secret to select from.  Must be a valid secret key.
                          type: string
                        name:
                          default: ""
                          description: |-
                            Name of the referent.
                            This field is effectively required, but due to backwards compatibility is
                            allowed to be empty. Instances of this type with an empty value here are
                            almost certainly wrong.
                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                          type: string
                        optional:
                          description: Specify whether the Secret or its key must be defined
                          type: boolean
                      required:
                        - key
                      type: object
                      x-kubernetes-map-type: atomic
                    port:
                      default: 5432
                      description: |-
                        Port, also opened by the runner's NetworkPolicy: a port in secretRef
                        must equal it.
                      format: int32
                      maximum: 65535
                      minimum: 1
                      type: integer
                    schemas:
                      description: SchemasSpec names the imposm schemas and the operator's bookkeeping schema.
                      properties:
                        backup:
                          default: backup
                          type: string
                        import:
                          default: import
                          type: string
                        production:
                          default: public
                          type: string
                        state:
                          default: imposm_operator
                          description: State is where the operator records imports and applied diffs.
                          type: string
                      type: object
                    secretRef:
                      description: |-
                        SecretRef names a Secret in the sync's namespace with the connection:
                        keys host, port, dbname, user and sslmode (each optional; the keys of
                        CloudNativePG's <cluster>-app secret). Its values win over the fields
                        above. Read by the runner only; the password still comes from
                        passwordSecretRef or pgpassSecretRef (which may name the same Secret).
                      properties:
                        name:
                          default: ""
                          description: |-
                            Name of the referent.
                            This field is effectively required, but due to backwards compatibility is
                            allowed to be empty. Instances of this type with an empty value here are
                            almost certainly wrong.
                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                          type: string
                      type: object
                      x-kubernetes-map-type: atomic
                    sslMode:
                      default: require
                      enum:
                        - disable
                        - require
                        - verify-ca
                        - verify-full
                      type: string
                    user:
                      description: Optional with secretRef.
                      minLength: 1
                      type: string
                  type: object
                  x-kubernetes-validations:
                    - message: host, database and user are required without secretRef
                      rule: has(self.secretRef) || (has(self.host) && has(self.database) && has(self.user))
                deletionPolicy:
                  default: Retain
                  description: |-
                    DeletionPolicy decides what happens to the cache volume when the sync is
                    deleted. The database is never touched.
                  enum:
                    - Retain
                    - Delete
                  type: string
                deploy:
                  description: DeploySpec controls promotion from the import to the production schema.
                  properties:
                    auto:
                      default: true
                      description: Auto deploys a new import once it has caught up with the upstream.
                      type: boolean
                    keepBackup:
                      description: KeepBackup keeps the previous production data in the backup schema.
                      type: boolean
                    syncDuringReimport:
                      default: auto
                      description: |-
                        SyncDuringReimport keeps production receiving diffs while a new import
                        is built (after a mapping, SRID, prefix, limitTo or schema change, or the
                        reimport action), so its lag does not grow until the deploy. Each import
                        keeps its own imposm cache meanwhile. auto: when the volume has room for
                        a second cache (about 1.2 times the current one); always: regardless;
                        never: production pauses until the new import is deployed.
                      enum:
                        - auto
                        - always
                        - never
                      type: string
                  type: object
                diffChunkSize:
                  default: 10
                  description: DiffChunkSize is how many diffs are handed to one `imposm diff` call.
                  format: int32
                  maximum: 1000
                  minimum: 1
                  type: integer
                imposm:
                  description: ImposmSpec are settings forwarded to imposm.
                  properties:
                    cacheCheckpointLimit:
                      anyOf:
                        - type: integer
                        - type: string
                      default: 4Gi
                      description: |-
                        CacheCheckpointLimit: imposm's cache and the database are not updated
                        atomically, so before each diff chunk the cache is checkpointed and an
                        interrupted chunk is rolled back. Reflink clones (XFS, btrfs, ZFS) are
                        always used when available; otherwise the cache is copied if it is
                        smaller than this limit. Without a checkpoint an interrupted chunk
                        triggers a re-import (production keeps serving). "0" disables copying.
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    expireTiles:
                      description: |-
                        ExpireTilesSpec enables imposm expire-tile lists (one "z/x/y" per line)
                        for tile cache invalidation: imposm's standard files on a volume, and/or a
                        Redis stream in zaptiles' format.
                        Tiles of a diff chunk are released only after the chunk committed and are
                        delivered at least once to every configured sink. When the changed tiles
                        cannot be known (a replacement import is deployed, or a chunk's commit was
                        only proven afterwards) the single tile 0/0/0 is sent, which invalidates
                        everything. Without files or redis, files are kept in the data volume
                        under expiretiles/.
                      properties:
                        files:
                          description: Files writes imposm's <YYYYMMDD>/<time>.tiles files to a shared volume.
                          properties:
                            subPath:
                              description: SubPath inside the volume.
                              type: string
                            volume:
                              description: Volume holding the files; typically an RWX persistentVolumeClaim.
                              properties:
                                csi:
                                  description: CSI is an inline CSI volume (the driver must support ephemeral inline use).
                                  properties:
                                    driver:
                                      description: |-
                                        driver is the name of the CSI driver that handles this volume.
                                        Consult with your admin for the correct name as registered in the cluster.
                                      type: string
                                    fsType:
                                      description: |-
                                        fsType to mount. Ex. "ext4", "xfs", "ntfs".
                                        If not provided, the empty value is passed to the associated CSI driver
                                        which will determine the default filesystem to apply.
                                      type: string
                                    nodePublishSecretRef:
                                      description: |-
                                        nodePublishSecretRef is a reference to the secret object containing
                                        sensitive information to pass to the CSI driver to complete the CSI
                                        NodePublishVolume and NodeUnpublishVolume calls.
                                        This field is optional, and  may be empty if no secret is required. If the
                                        secret object contains more than one secret, all secret references are passed.
                                      properties:
                                        name:
                                          default: ""
                                          description: |-
                                            Name of the referent.
                                            This field is effectively required, but due to backwards compatibility is
                                            allowed to be empty. Instances of this type with an empty value here are
                                            almost certainly wrong.
                                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                          type: string
                                      type: object
                                      x-kubernetes-map-type: atomic
                                    readOnly:
                                      description: |-
                                        readOnly specifies a read-only configuration for the volume.
                                        Defaults to false (read/write).
                                      type: boolean
                                    volumeAttributes:
                                      additionalProperties:
                                        type: string
                                      description: |-
                                        volumeAttributes stores driver-specific properties that are passed to the CSI
                                        driver. Consult your driver's documentation for supported values.
                                      type: object
                                  required:
                                    - driver
                                  type: object
                                nfs:
                                  description: |-
                                    Represents an NFS mount that lasts the lifetime of a pod.
                                    NFS volumes do not support ownership management or SELinux relabeling.
                                  properties:
                                    path:
                                      description: |-
                                        path that is exported by the NFS server.
                                        More info: https://kubernetes.io/docs/concepts/storage/volumes#nfs
                                      type: string
                                    readOnly:
                                      description: |-
                                        readOnly here will force the NFS export to be mounted with read-only permissions.
                                        Defaults to false.
                                        More info: https://kubernetes.io/docs/concepts/storage/volumes#nfs
                                      type: boolean
                                    server:
                                      description: |-
                                        server is the hostname or IP address of the NFS server.
                                        More info: https://kubernetes.io/docs/concepts/storage/volumes#nfs
                                      type: string
                                  required:
                                    - path
                                    - server
                                  type: object
                                persistentVolumeClaim:
                                  description: |-
                                    PersistentVolumeClaimVolumeSource references the user's PVC in the same namespace.
                                    This volume finds the bound PV and mounts that volume for the pod. A
                                    PersistentVolumeClaimVolumeSource is, essentially, a wrapper around another
                                    type of volume that is owned by someone else (the system).
                                  properties:
                                    claimName:
                                      description: |-
                                        claimName is the name of a PersistentVolumeClaim in the same namespace as the pod using this volume.
                                        More info: https://kubernetes.io/docs/concepts/storage/persistent-volumes#persistentvolumeclaims
                                      type: string
                                    readOnly:
                                      description: |-
                                        readOnly Will force the ReadOnly setting in VolumeMounts.
                                        Default false.
                                      type: boolean
                                  required:
                                    - claimName
                                  type: object
                              type: object
                              x-kubernetes-validations:
                                - message: set exactly one of persistentVolumeClaim, csi or nfs
                                  rule: '(has(self.persistentVolumeClaim) ? 1 : 0) + (has(self.csi) ? 1 : 0) + (has(self.nfs) ? 1 : 0) == 1'
                          required:
                            - volume
                          type: object
                        redis:
                          description: Redis adds one stream message per tile file.
                          properties:
                            field:
                              default: tiles
                              description: Field of the message holding the tile lines.
                              type: string
                            maxLen:
                              default: 100000
                              description: MaxLen trims the stream approximately; 0 disables trimming.
                              format: int64
                              minimum: 0
                              type: integer
                            passwordSecretRef:
                              description: PasswordSecretRef overrides the URL's password.
                              properties:
                                key:
                                  description: The key of the secret to select from.  Must be a valid secret key.
                                  type: string
                                name:
                                  default: ""
                                  description: |-
                                    Name of the referent.
                                    This field is effectively required, but due to backwards compatibility is
                                    allowed to be empty. Instances of this type with an empty value here are
                                    almost certainly wrong.
                                    More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                  type: string
                                optional:
                                  description: Specify whether the Secret or its key must be defined
                                  type: boolean
                              required:
                                - key
                              type: object
                              x-kubernetes-map-type: atomic
                            stream:
                              default: expiretiles
                              type: string
                            url:
                              description: URL without credentials, redis:// or rediss:// (TLS).
                              pattern: ^rediss?://
                              type: string
                            urlSecretRef:
                              description: URLSecretRef reads the URL (may contain a password) from a Secret.
                              properties:
                                key:
                                  description: The key of the secret to select from.  Must be a valid secret key.
                                  type: string
                                name:
                                  default: ""
                                  description: |-
                                    Name of the referent.
                                    This field is effectively required, but due to backwards compatibility is
                                    allowed to be empty. Instances of this type with an empty value here are
                                    almost certainly wrong.
                                    More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                  type: string
                                optional:
                                  description: Specify whether the Secret or its key must be defined
                                  type: boolean
                              required:
                                - key
                              type: object
                              x-kubernetes-map-type: atomic
                          type: object
                          x-kubernetes-validations:
                            - message: exactly one of url or urlSecretRef
                              rule: has(self.url) != has(self.urlSecretRef)
                        zoom:
                          default: 14
                          description: |-
                            Zoom is the deepest zoom of the expire tiles; imposm also writes
                            coarser zooms for large features. imposm only supports 6-18.
                          format: int32
                          maximum: 18
                          minimum: 6
                          type: integer
                      type: object
                    limitTo:
                      description: |-
                        LimitTo restricts the import and all diffs to polygons (imposm limitto),
                        e.g. several regions from one larger extract and its replication.
                      properties:
                        cacheBufferDegrees:
                          description: |-
                            CacheBufferDegrees keeps nodes this far (in degrees) outside the
                            polygons in the cache, so ways crossing the edge stay complete
                            (imposm limitto_cache_buffer). Decimal string, e.g. "0.05".
                          pattern: ^[0-9]+(\.[0-9]+)?$
                          type: string
                        configMapRef:
                          description: ConfigMapKeyRef selects one key of a ConfigMap in the same namespace.
                          properties:
                            key:
                              minLength: 1
                              type: string
                            name:
                              minLength: 1
                              type: string
                          required:
                            - key
                            - name
                          type: object
                        inline:
                          type: string
                      type: object
                      x-kubernetes-validations:
                        - message: exactly one of inline or configMapRef
                          rule: has(self.inline) != has(self.configMapRef)
                    optimize:
                      description: Optimize runs `imposm import -optimize` after writing.
                      type: boolean
                    srid:
                      default: 3857
                      enum:
                        - 3857
                        - 4326
                      format: int32
                      type: integer
                    tablePrefix:
                      description: |-
                        TablePrefix replaces imposm's standard "osm_" table prefix: tables are
                        named <prefix>_<table>. Only needed to run several syncs into the same
                        schemas (prefer separate schemas). Unset: imposm's osm_ tables.
                      pattern: ^[a-z][a-z0-9]{0,19}_?$
                      type: string
                  type: object
                mapping:
                  description: |-
                    MappingSpec lists the parts of the imposm mapping. Parts are merged
                    strictly: a table defined in two parts is an error.
                  properties:
                    sources:
                      items:
                        description: MappingSource is exactly one of ConfigMapRef or Inline.
                        properties:
                          configMapRef:
                            description: 'ConfigMapRef: every selected key is one mapping part.'
                            properties:
                              keys:
                                description: Keys to use; all *.yaml/*.yml/*.json keys when empty.
                                items:
                                  type: string
                                maxItems: 64
                                type: array
                                x-kubernetes-list-type: set
                              name:
                                minLength: 1
                                type: string
                            required:
                              - name
                            type: object
                          inline:
                            description: Inline mapping YAML, for small mappings and tests.
                            type: string
                        type: object
                        x-kubernetes-validations:
                          - message: exactly one of configMapRef or inline
                            rule: has(self.configMapRef) != has(self.inline)
                      maxItems: 32
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: atomic
                  required:
                    - sources
                  type: object
                maxDiffsPerRun:
                  default: 100
                  description: |-
                    MaxDiffsPerRun caps how many replication diffs one run applies, so a long
                    outage is caught up over several bounded runs.
                  format: int32
                  maximum: 100000
                  minimum: 1
                  type: integer
                metadata:
                  description: |-
                    Metadata keeps OSM element metadata (version, timestamp, changeset),
                    optionally their history and the changesets, in tables next to
                    imposm's. Versions and timestamps work with any source; changesets
                    need one whose snapshot and diffs carry changeset ids (the public
                    Geofabrik downloads do not). Changing it never re-imports imposm's
                    tables.
                  properties:
                    changesets:
                      description: |-
                        ChangesetsSpec keeps the changesets (comment, tags, bounding box) that
                        touch the sync's area, from OpenStreetMap's changeset replication.
                      properties:
                        bbox:
                          description: |-
                            BBox "minLon,minLat,maxLon,maxLat": changesets whose bounding box
                            intersects it are kept. Default: the bounding box in the snapshot's
                            header.
                          type: string
                        enabled:
                          type: boolean
                        indexText:
                          description: IndexText adds a full-text index on changeset comments.
                          type: boolean
                        maxFilesPerRun:
                          default: 1500
                          description: |-
                            MaxFilesPerRun bounds the replication files one run fetches (one per
                            minute upstream); a backlog is caught up over several runs.
                          format: int32
                          maximum: 100000
                          minimum: 1
                          type: integer
                        replicationURL:
                          default: https://planet.openstreetmap.org/replication/changesets/
                          description: |-
                            ReplicationURL is the changeset replication directory (the one holding
                            state.yaml).
                          pattern: ^https?://
                          type: string
                        retention:
                          description: |-
                            Retention deletes changesets closed longer ago than this ("<n>d" or
                            "<n>h") that no kept metadata or history row refers to. Unset: kept.
                          pattern: ^[0-9]+[dh]$
                          type: string
                      type: object
                    elements:
                      default: tagged
                      description: |-
                        Elements whose metadata is kept: none, tagged (every way and relation,
                        and nodes with tags), or all (also untagged nodes, about ten times the
                        rows).
                      enum:
                        - none
                        - tagged
                        - all
                      type: string
                    history:
                      description: HistorySpec keeps every version of an element seen since the sync started.
                      properties:
                        indexTags:
                          description: |-
                            IndexTags adds a GIN index on the tags of the history (mode full), for
                            searching every edit of a tag.
                          type: boolean
                        mode:
                          default: none
                          description: |-
                            Mode: none; versions (metadata of every version); full (also each
                            version's tags, node position, way nodes and relation members: an
                            audit trail of what changed).
                          enum:
                            - none
                            - versions
                            - full
                          type: string
                        retention:
                          description: |-
                            HistoryRetention: when history rows are deleted or reduced. Durations are
                            "<n>d" or "<n>h". Unset: kept forever. An element's newest version is
                            never deleted while the element exists.
                          properties:
                            content:
                              description: |-
                                Content (mode full) clears the content columns of versions replaced
                                longer ago than this; their metadata rows stay.
                              pattern: ^[0-9]+[dh]$
                              type: string
                            deleted:
                              description: |-
                                Deleted removes the whole history of elements deleted in OSM longer
                                ago than this.
                              pattern: ^[0-9]+[dh]$
                              type: string
                            maxAge:
                              description: MaxAge deletes versions replaced longer ago than this.
                              pattern: ^[0-9]+[dh]$
                              type: string
                            maxVersions:
                              description: 'MaxVersions keeps only the newest N versions per element (0: all).'
                              format: int32
                              minimum: 0
                              type: integer
                          type: object
                      type: object
                    schema:
                      description: |-
                        Schema of the metadata tables, one per sync (the first sync to use
                        it claims it; another is refused). Must differ from database.schemas.
                        Default: the production schema with "_history" (osm_history for osm).
                      type: string
                  type: object
                runner:
                  description: |-
                    RunnerSpec configures the sync Job pods.

                    The runner image and service account are set by the operator's admin (chart
                    values / controller flags), not per sync: whoever may write a sync must not
                    be able to run arbitrary code or borrow a service account through it.
                  properties:
                    activeDeadline:
                      default: 24h
                      description: |-
                        ActiveDeadline bounds a single run, as a Go duration: "24h", "90m",
                        "1h30m", "38s". At least one minute. Import steps resume across runs,
                        but each step (e.g. imposm -write of the planet) must fit in one run.
                      pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                      type: string
                    annotations:
                      additionalProperties:
                        type: string
                      description: |-
                        Annotations added to the runner pods (e.g. backup or autoscaler opt-outs).
                        Keys under imposm.johanjk.github.io/ are reserved.
                      type: object
                      x-kubernetes-validations:
                        - message: keys under imposm.johanjk.github.io/ are reserved
                          rule: self.all(k, !k.startsWith('imposm.johanjk.github.io/') && !k.contains('.imposm.johanjk.github.io/'))
                    imagePullPolicy:
                      description: PullPolicy describes a policy for if/when to pull a container image
                      type: string
                    imagePullSecrets:
                      items:
                        description: |-
                          LocalObjectReference contains enough information to let you locate the
                          referenced object inside the same namespace.
                        properties:
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                        type: object
                        x-kubernetes-map-type: atomic
                      type: array
                    labels:
                      additionalProperties:
                        type: string
                      description: |-
                        Labels added to the runner pods (e.g. cost allocation, mesh opt-out).
                        Keys under imposm.johanjk.github.io/ and app.kubernetes.io/ are reserved.
                      type: object
                      x-kubernetes-validations:
                        - message: keys under imposm.johanjk.github.io/ and app.kubernetes.io/ are reserved
                          rule: self.all(k, !k.startsWith('imposm.johanjk.github.io/') && !k.contains('.imposm.johanjk.github.io/') && !k.startsWith('app.kubernetes.io/') && !k.contains('.app.kubernetes.io/'))
                    nodeSelector:
                      additionalProperties:
                        type: string
                      type: object
                    resources:
                      description: ResourceRequirements describes the compute resource requirements.
                      properties:
                        claims:
                          description: |-
                            Claims lists the names of resources, defined in spec.resourceClaims,
                            that are used by this container.

                            This field depends on the
                            DynamicResourceAllocation feature gate.

                            This field is immutable. It can only be set for containers.
                          items:
                            description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                            properties:
                              name:
                                description: |-
                                  Name must match the name of one entry in pod.spec.resourceClaims of
                                  the Pod where this field is used. It makes that resource available
                                  inside a container.
                                type: string
                              request:
                                description: |-
                                  Request is the name chosen for a request in the referenced claim.
                                  If empty, everything from the claim is made available, otherwise
                                  only the result of this request.
                                type: string
