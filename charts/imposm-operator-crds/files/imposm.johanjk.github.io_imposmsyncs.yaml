metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: imposmsyncs.imposm.johanjk.github.io
spec:
  group: imposm.johanjk.github.io
  names:
    categories:
      - osm
    kind: ImposmSync
    listKind: ImposmSyncList
    plural: imposmsyncs
    shortNames:
      - isync
    singular: imposmsync
  scope: Namespaced
