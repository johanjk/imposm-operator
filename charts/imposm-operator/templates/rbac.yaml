{{- if .Values.rbac.create }}
{{- $cluster := eq .Values.rbac.scope "cluster" }}
{{- $name := include "imposm.fullname" . }}
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ ternary "ClusterRole" "Role" $cluster }}
metadata:
  name: {{ $name }}
  {{- if not $cluster }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
  labels: {{- include "imposm.labels" . | nindent 4 }}
rules:
  {{- if eq .Values.mode "crd" }}
  - apiGroups: [imposm.johanjk.github.io]
    resources: [imposmsyncs]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [imposm.johanjk.github.io]
    resources: [imposmsyncs/status]
    verbs: [get, update, patch]
  {{- end }}
  # spec / mapping ConfigMaps (read), run and status ConfigMaps (write)
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, watch, create, patch]
  # run results are read from the runner pods' termination messages
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  # live progress (status.activeRun) is read from the runner's log
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create]
  - apiGroups: [""]
    resources: [serviceaccounts]   # one per sync, for its runner pods (no bindings)
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]   # one per sync, for its runner pods
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["", events.k8s.io]
    resources: [events]
    verbs: [create, patch]
  {{- if not $cluster }}
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ ternary "ClusterRoleBinding" "RoleBinding" $cluster }}
metadata:
  name: {{ $name }}
  {{- if not $cluster }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
  labels: {{- include "imposm.labels" . | nindent 4 }}
  annotations:
    ignore-check.kube-linter.io/access-to-create-pods: >-
      The operator runs syncs as CronJobs and one-off Jobs; their pods use the
      operator's runner image and per-sync service account, never the sync's.
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ ternary "ClusterRole" "Role" $cluster }}
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- if $cluster }}
---
# Leader election Lease lives in the release namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels: {{- include "imposm.labels" . | nindent 4 }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels: {{- include "imposm.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
